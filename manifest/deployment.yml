apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeploy

spec:
  replicas: 3

  selector:
    matchLabels:
      app: eks

  template:
    metadata:
      labels:
        app: eks

    spec:
      containers:
        - name: cont1
          image: bharath0803/project:appimage-v1
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: mysrc

spec:
  type: LoadBalancer

  selector:
    app: eks

  ports:
    - port: 2222
      targetPort: 8080
