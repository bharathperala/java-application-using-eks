apiVersion: apps/v1
kind: deployment
metadata:
  name: mydeploy
spec:
  replicas: 3

  selector:
    matchlabels:
        app: eks

  template:
    metadata:
      labels:
       app: eks

  containers:
    - name: cont1
      image: bharath0803/project:appimage-v1
      ports:
        - containerPort: 8080


---
apiVersion: v1
kind: Service
metadata:
  name: mysrc
spec:
  type: Loadbalancer
  selector:
    app: eks
  ports:
    - port: 8080
      targetPort: 8080
